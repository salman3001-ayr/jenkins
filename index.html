<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Glassmorphism Card</title>
  <style>
    /* Reset & Dynamic Gradient Background */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #020617);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glowing Background Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 1;
      opacity: 0.6;
    }

    .orb-1 {
      width: 280px;
      height: 280px;
      background: #ec4899;
      top: 15%;
      left: 20%;
    }

    .orb-2 {
      width: 320px;
      height: 320px;
      background: #3b82f6;
      bottom: 15%;
      right: 20%;
    }

    /* Animated Border Wrapper */
    .card-wrapper {
      position: relative;
      border-radius: 20px;
      padding: 2px;
      z-index: 2;
      background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.05));
    }

    /* Glassmorphism Card */
    .card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      width: 340px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.3);
    }

    /* Glowing Badge */
    .badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      color: #ffffff;
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .card p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Pulsing Neon Button */
    .btn {
      position: relative;
      display: inline-block;
      width: 100%;
      padding: 14px 0;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .btn:hover {
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.7);
      transform: translateY(-2px);
    }

    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: rotate(30deg);
      transition: 0.8s;
    }

    .btn:hover::after {
      left: 100%;
    }
  </style>
</head>
<body>

  <!-- Ambient background glow elements -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Interactive Glass Card -->
  <div class="card-wrapper">
    <div class="card">
      <span class="badge">Interactive UI</span>
      <h2>Next-Gen Card</h2>
      <p>Featuring modern CSS glassmorphism, animated mesh gradients, floating glow orbs, and hover transitions.</p>
      <a href="#" class="btn">Explore Design</a>
    </div>
  </div>

</body>
</html>
